name: deploy-frontend

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Deploy target"
        required: true
        type: choice
        options: [yamada, arako]
        default: yamada

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set env (yamada)
        if: ${{ github.event.inputs.env == 'yamada' }}
        run: |
          echo "S3_BUCKET=mtr-map-spa" >> $GITHUB_ENV
          echo "ROLE_TO_ASSUME=arn:aws:iam::016944483672:role/github-actions-deploy-frontend" >> $GITHUB_ENV

      - name: Set env (arako)
        if: ${{ github.event.inputs.env == 'arako' }}
        run: |
          echo "S3_BUCKET=TODO" >> $GITHUB_ENV
          echo "ROLE_TO_ASSUME=TODO" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      # ★ まずここで「本当にどこに package-lock があるか」確定させる
      - name: Debug repo tree
        run: |
          pwd
          ls -la
          echo "---- find package.json / package-lock.json ----"
          find . -maxdepth 4 -name "package.json" -print
          find . -maxdepth 4 -name "package-lock.json" -print
          echo "---- list mattero_map ----"
          ls -la mattero_map || true

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          # ★ repoルートから見たパスで固定（ここがズレると即死）
          cache-dependency-path: mattero_map/package-lock.json

      - name: Install
        working-directory: mattero_map
        run: npm ci

      - name: Build
        working-directory: mattero_map
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./mattero_map/out s3://${{ env.S3_BUCKET }}/ --delete
